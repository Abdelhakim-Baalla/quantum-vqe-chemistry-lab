name: Feature request
description: Propose a scoped improvement or a scientifically justified extension.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project prioritizes auditability and reproducibility. Large
        scientific changes should describe their validation plan before
        implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What is missing or difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful version and the affected modules.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scientific pipeline / chemistry
        - VQE or optimizer
        - Result schema or export
        - Streamlit interface
        - Charts or theme
        - Documentation
        - CI or packaging
        - New experiment (for example QAOA)
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: How will the change be tested, and what reference or derivation supports it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: This request does not rely on fabricated results or a quantum-advantage claim.
          required: true
        - label: I searched existing issues and the roadmap first.
          required: true
