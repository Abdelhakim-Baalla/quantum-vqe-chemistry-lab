[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quantum-vqe-chemistry-lab"
version = "0.1.0"
description = "Reproducible variational quantum eigensolver experiments for quantum chemistry, starting with H2/STO-3G."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Quantum VQE Chemistry Lab contributors" }]
keywords = ["quantum computing", "quantum chemistry", "VQE", "Qiskit", "H2", "UCCSD"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "qiskit>=2.1,<3.0",
  "qiskit-nature[pyscf]>=0.8,<0.9",
  "numpy>=2.0,<3.0",
  "scipy>=1.11,<2.0",
  "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<8",
  "ruff>=0.6,<1.0",
]
web = [
  "streamlit>=1.66,<2.0",
  "pandas>=2.0,<3.0",
  "altair>=5.0,<7.0",
  "pylatexenc>=2.10,<3.0",
]

[project.scripts]
quantum-vqe = "quantum_vqe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_vqe"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: exercises the PySCF/Qiskit chemistry pipeline end to end",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"
